<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Highlights · EB Sports</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A111E;--panel:#121C30;--panel2:#18243C;--line:#26344F;--ink:#EAF0F8;--ink2:#97A6BF;--ink3:#66758F;--gold:#FFD54A;
  --display:'Barlow Condensed','Roboto Condensed','Arial Narrow',sans-serif;--body:'Barlow',Roboto,system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px}
body{padding:18px 34px 40px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.top h1{margin:0;font-family:var(--display);font-size:26px;letter-spacing:.04em;flex:1}
.top h1 span{color:var(--ink2);font-size:18px;margin-left:8px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-weight:600;font-size:14px}
.btn:hover{background:var(--panel2)}
.btn.primary{background:#1F3B2A;border-color:#2F5A3E}
.clips{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.clip{border-radius:12px;background:var(--panel);border:1px solid var(--line);overflow:hidden}
.clip:hover{background:var(--panel2);border-color:#3A4C70}
.clip .th{position:relative;aspect-ratio:16/9;background:#05080E}
.clip .th img{width:100%;height:100%;object-fit:cover;display:block}
.clip .th i{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.75);font-style:normal;font-size:12px;font-weight:600;padding:1px 6px;border-radius:5px}
.clip .tt{padding:8px 10px 10px;font-size:13px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:43px}
#msg{color:var(--ink2);padding:40px 0;text-align:center}

/* full screen playback */
#play{position:fixed;inset:0;z-index:30;background:#000}
#play[hidden]{display:none}
#play video,#play iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
#cap{position:absolute;left:0;right:0;top:0;padding:16px 26px 34px;background:linear-gradient(rgba(0,0,0,.8),transparent);transition:opacity .3s;pointer-events:none}
#cap.off{opacity:0}
#cap b{font-size:18px}
#cap div{color:var(--ink2);font-size:13px;margin-top:4px}
</style>
<script>window.__STV_FORCE = 1</script>
<script src="tv/tv-nav.js?v=202611081253"></script>
<script src="tv/common.js?v=202611081253"></script>
</head>
<body>
<div class="top"><h1 id="ttl">Highlights</h1><button class="btn primary" id="all" type="button" hidden>▶ Play all</button><button class="btn" id="back" type="button">Back to games</button></div>
<div id="main"><p id="msg">Loading highlights…</p></div>
<div id="play" hidden role="dialog" aria-modal="true" aria-label="Highlight">
  <div id="stage"></div>
  <div id="cap"><b id="capt"></b><div id="caps"></div></div>
</div>
<script>
'use strict';
/* ESPN's official highlight clips for a game, from its game summary. Pick one, or Play all to run
   them back to back. While a clip plays: Select pauses, left and right skip 10 seconds, Up and Down
   go to the previous or next clip, Back returns to the list. */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nav = () => window.__tvNav;
const PATHS = { nba: 'basketball/nba', nfl: 'football/nfl', cfb: 'football/college-football', mlb: 'baseball/mlb' };
let G = {}; try { G = JSON.parse(new URLSearchParams(location.search).get('g') || '{}'); } catch (e) {}
let clips = [], cur = -1, all = false, capT = null;

$('ttl').innerHTML = `${esc(G.title || 'Highlights')}<span>Highlights</span>`;
$('back').onclick = () => { history.length > 1 ? history.back() : (location.href = 'index.html'); };

// the best way to play each clip: a direct MP4, then HLS, then ESPN's own player page
function sourceOf(v) {
  const s = (v.links && v.links.source) || {};
  const pick = (...x) => x.find(u => typeof u === 'string' && u);
  const mp4 = pick(s.HD && s.HD.href, s.full && s.full.href, s.mezzanine && s.mezzanine.href, s.href);
  if (mp4 && !/\.m3u8/i.test(mp4)) return { kind: 'mp4', url: mp4 };
  const hls = pick(s.HLS && s.HLS.HD && s.HLS.HD.href, s.HLS && s.HLS.href);
  if (hls) return { kind: 'hls', url: hls };
  if (v.id && /^\d+$/.test(String(v.id))) return { kind: 'embed', url: `https://www.espn.com/core/video/iframe?id=${v.id}&endcard=false` };
  return null;
}
function readClips(d) {
  const raw = d.videos || (d.news && d.news.videos) || [];
  return raw.map(v => ({
    title: v.headline || v.title || v.name || '',
    desc: v.description || v.caption || '',
    thumb: v.thumbnail || ((v.images || [])[0] || {}).url || ((v.posterImages || {}).default || {}).href || '',
    secs: +v.duration || 0,
    at: v.originalPublishDate || v.lastModified || v.published || '',
    src: sourceOf(v)
  })).filter(c => c.title && c.src)
    // in game order: oldest first, so Play all runs like the game did
    .sort((a, b) => String(a.at).localeCompare(String(b.at)));
}
const dur = s => s ? `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, '0')}` : '';
function list() {
  if (!clips.length) { $('main').innerHTML = '<p id="msg">No highlights for this game yet.</p>'; return; }
  $('all').hidden = false;
  $('main').innerHTML = `<div class="clips">${clips.map((c, i) => `<button class="clip" type="button" data-i="${i}">
    <div class="th">${c.thumb ? `<img src="${esc(c.thumb)}" alt="" loading="lazy">` : ''}${c.secs ? `<i>${dur(c.secs)}</i>` : ''}</div>
    <div class="tt">${esc(c.title)}</div></button>`).join('')}</div>`;
  setTimeout(() => { const b = document.querySelector('.clip'); if (b && nav()) nav().focus(b); }, 60);
}
$('main').addEventListener('click', e => { const b = e.target.closest('[data-i]'); if (b) { all = false; play(+b.dataset.i); } });
$('all').onclick = () => { all = true; play(0); };

/* ---------- playing ---------- */
let hls = null;
function stop() { if (hls) { try { hls.destroy(); } catch (e) {} hls = null; } $('stage').innerHTML = ''; }
function caption() {
  const c = clips[cur]; if (!c) return;
  $('capt').textContent = c.title;
  $('caps').textContent = `${cur + 1} of ${clips.length}${all ? ' · Playing all' : ''} · Up/Down: previous/next · Back: list`;
  $('cap').classList.remove('off');
  clearTimeout(capT); capT = setTimeout(() => $('cap').classList.add('off'), 3500);
}
async function play(i) {
  if (i < 0 || i >= clips.length) { closePlay(); return; }
  cur = i; stop();
  const c = clips[i];
  $('play').hidden = false;
  if (STV.bridge) STV.bridge.call('keepAwake', true);
  caption();
  if (c.src.kind === 'embed') {
    const f = document.createElement('iframe');
    f.src = c.src.url; f.allow = 'autoplay; fullscreen; encrypted-media';
    $('stage').appendChild(f);
    return;
  }
  const v = document.createElement('video');
  v.autoplay = true; v.playsInline = true;
  v.addEventListener('ended', () => { if (all) play(cur + 1); else closePlay(); });
  v.addEventListener('error', () => { if (all) play(cur + 1); });
  $('stage').appendChild(v);
  if (c.src.kind === 'hls' && !v.canPlayType('application/vnd.apple.mpegurl')) {
    try {
      if (!window.Hls) await new Promise((ok, no) => { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js'; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
      if (window.Hls && Hls.isSupported()) { hls = new Hls(); hls.loadSource(c.src.url); hls.attachMedia(v); } else v.src = c.src.url;
    } catch (e) { v.src = c.src.url; }
  } else v.src = c.src.url;
  v.play().catch(() => {});
}
function closePlay() {
  stop(); $('play').hidden = true; all = false;
  if (STV.bridge) STV.bridge.call('keepAwake', false);
  const b = document.querySelector(`[data-i="${Math.max(0, cur)}"]`);
  setTimeout(() => { if (b && nav()) nav().focus(b); }, 40);
}
const playing = () => !$('play').hidden;
window.addEventListener('keydown', e => {
  if (!playing()) return;
  const v = document.querySelector('#stage video'), k = e.key;
  if (k === 'Enter' || e.keyCode === 23) { if (v) v.paused ? v.play() : v.pause(); caption(); }
  else if (k === 'ArrowLeft') { if (v) v.currentTime = Math.max(0, v.currentTime - 10); caption(); }
  else if (k === 'ArrowRight') { if (v) v.currentTime += 10; caption(); }
  else if (k === 'ArrowDown') play(cur + 1);
  else if (k === 'ArrowUp') play(cur - 1);
  else if (k === 'Escape') closePlay();
  else return;
  e.preventDefault(); e.stopImmediatePropagation();
}, true);
window.__tvBackHook = () => { if (playing()) { closePlay(); return true; } return false; };
window.__tvMedia = a => {
  const v = document.querySelector('#stage video'); if (!v) return true;
  if (a === 'ff') v.currentTime += 10; else if (a === 'rw') v.currentTime -= 10; else v.paused ? v.play() : v.pause();
  return true;
};

if (!PATHS[G.sport] || !G.gameId) $('main').innerHTML = '<p id="msg">No highlights for this game.</p>';
else fetch(`https://site.api.espn.com/apis/site/v2/sports/${PATHS[G.sport]}/summary?event=${encodeURIComponent(G.gameId)}`, { cache: 'no-store' })
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(d => { clips = readClips(d); list(); })
  .catch(() => { $('main').innerHTML = '<p id="msg">Couldn\'t load highlights.</p>'; });
</script>
</body>
</html>
