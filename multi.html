<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Multiview · EB Sports</title>
<style>
:root{--ink:#EAF0F8;--ink2:#A7B4CA;--gold:#FFD54A}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:var(--ink);font-family:Barlow,Roboto,system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}

/* the games */
#grid{position:fixed;inset:0;display:grid;gap:3px;background:#000;align-content:center;align-items:center}
#grid.n1{grid-template-columns:1fr}
#grid.grid.n2{grid-template-columns:1fr 1fr}
#grid.grid.n3,#grid.grid.n4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;align-content:stretch;align-items:stretch}
#grid.focus.n2{grid-template-columns:2fr 1fr}
#grid.focus.n3{grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;align-content:stretch;align-items:stretch}
#grid.focus.n4{grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr 1fr;align-content:stretch;align-items:stretch}
#grid.focus .tile.big{grid-row:1/-1;order:-1}
#grid.n1 .tile,#grid.n2 .tile{aspect-ratio:16/9}
#grid.solo .tile{display:none}
#grid.solo .tile.solo{display:block;position:fixed;inset:0;z-index:5;aspect-ratio:auto}
#grid.solo .tile.solo::after{display:none}
.tile{position:relative;background:#05080E;overflow:hidden;min-height:0}
.tile iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.tile::after{content:"";position:absolute;inset:0;pointer-events:none;border:3px solid transparent;transition:border-color .15s}
.tile.sel::after{border-color:var(--gold)}
.cap{position:absolute;left:8px;top:8px;z-index:2;display:flex;gap:8px;align-items:center;padding:3px 10px;border-radius:8px;
  background:rgba(0,0,0,.7);font-size:13px;font-weight:600;pointer-events:none;opacity:.55;transition:opacity .2s}
.tile.sel .cap,.tile.aud .cap{opacity:1}
.cap .st{color:var(--ink2);font-weight:500}
html.dev-phone .cap{pointer-events:auto;opacity:.85;padding:6px 12px}
.cap .sp{display:none;color:var(--gold)}
.tile.aud .cap .sp{display:inline}
.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;color:var(--ink2);font-size:15px}

/* options bar */
/* compact controls: icon buttons, small text chips; the highlighted button's name shows under them */
#bar{position:fixed;left:0;right:0;top:0;z-index:10;padding:12px 22px 26px;background:linear-gradient(rgba(0,0,0,.88),rgba(0,0,0,.55) 72%,transparent);
  display:flex;flex-direction:column;gap:8px;transition:opacity .25s}
.ic{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none;
  border:1px solid rgba(255,255,255,.2);background:rgba(20,28,44,.85);color:var(--ink)}
.ic svg{width:22px;height:22px}
.ic:hover{background:rgba(40,54,82,.96)}
.ic.on,.ic.on:hover,.chip.on:hover{background:var(--ink);color:#0A111E;border-color:var(--ink)}
.ic.live{color:#FF5A63}
.sep{width:1px;height:24px;background:rgba(255,255,255,.18);margin:0 2px;align-self:center;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
#bar.off{opacity:0;pointer-events:none;visibility:hidden}
.ttl{display:flex;align-items:baseline;gap:14px}
.ttl h1{margin:0;font-size:20px;font-weight:700}
.ttl span{color:var(--ink2);font-size:13px}
.chip{padding:6px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.2);background:rgba(20,28,44,.88);font-weight:600;font-size:14px;line-height:26px}
.chip:hover{background:rgba(40,54,82,.96)}
.chip.on{background:var(--ink);color:#0A111E;border-color:var(--ink)}
.hint{color:var(--ink2);font-size:13px;min-height:17px}
.hint b{color:var(--ink);font-weight:600}
/* game picker for adding or switching a game */
#pick{position:fixed;inset:0;z-index:40;background:rgba(4,7,12,.82);display:flex;align-items:center;justify-content:center;padding:22px}
#pick[hidden]{display:none}
#pick .pk{width:min(860px,100%);max-height:100%;overflow:auto;background:#121C30;border:1px solid #26344F;border-radius:16px;padding:16px 18px}
#pick h2{margin:0 0 4px;font-size:22px}
#pick .sub{color:var(--ink2);font-size:13px;margin:0 0 12px}
#pick .pkl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#pick .pg{padding:10px 12px;border-radius:12px;background:#18243C;border:1px solid #26344F;text-align:left}
#pick .pg:hover{background:#22314F}
#pick .pg b{display:block;font-size:16px}
#pick .pg span{font-size:12px;color:var(--ink2)}
#pick .pg span.live{color:#FF6B6B;font-weight:700}
#pick .sh{grid-column:1/-1;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);margin-top:6px}
#pick .row{margin-top:12px}
#msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px;color:var(--ink2);font-size:18px;line-height:1.5}
#msg[hidden]{display:none}

/* phones: a button to open the controls (taps on the video go to the video itself) */
#fab{display:none;position:fixed;right:14px;bottom:14px;z-index:15;width:46px;height:46px;border-radius:50%;
  background:rgba(10,17,30,.72);border:1px solid rgba(255,255,255,.25);color:#fff;font-size:22px;line-height:1}
html.dev-phone #fab{display:flex;align-items:center;justify-content:center}
html.dev-phone #bar{padding:10px 12px 22px}
html.dev-phone .ic{width:38px;height:38px}
html.dev-phone .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
html.dev-phone .chips::-webkit-scrollbar{display:none}
html.dev-phone .ttl h1{font-size:17px}
html.dev-phone .hint{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* LIVE button: red dot at live, gray when behind (as on YouTube) */
.livedot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#8C97AA;margin-right:6px;vertical-align:1px}
.livedot.on{background:#FF3B45;box-shadow:0 0 6px rgba(255,59,69,.8)}
</style>
<script>window.__STV_FORCE = 1</script>
<script src="tv/tv-nav.js?v=202611081421"></script>
<script src="tv/common.js?v=202611081421"></script>
<script src="tv/boxscore.js?v=202611081421"></script>
</head>
<body>
<div id="grid"></div>
<div id="msg" hidden></div>
<button id="fab" type="button" aria-label="Controls">⋯</button>
<div id="pick" role="dialog" aria-modal="true" aria-label="Pick a game" hidden>
  <div class="pk"><h2 id="pkt">Add a game</h2><p class="sub" id="pks"></p><div class="pkl" id="pkl"></div>
  <div class="row"><button class="chip" type="button" id="pkx">Cancel</button></div></div>
</div>
<div id="bar" class="off" role="dialog" aria-modal="true" aria-label="Multiview options">
  <div class="ttl"><h1>Multiview</h1><span id="sub"></span></div>
  <div class="chips" id="chips"></div>
  <div class="hint" id="hint"></div>
</div>
<script>
'use strict';
/* Up to four games at once. With the options bar closed: arrows move to a game and the sound
   goes with it, Menu (☰) opens the options. In the Fire TV app each game's player takes commands
   (mute, play, fill screen) through the same keyed script the single player uses. */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nav = () => window.__tvNav;
const bridge = STV.bridge;
const SPORT_NAME = { nba: 'NBA', nfl: 'NFL', cfb: 'College', mlb: 'MLB' };

const multi = () => { try { return JSON.parse(sessionStorage.getItem('stv.multi') || '[]'); } catch (e) { return []; } };
const saveMulti = l => sessionStorage.setItem('stv.multi', JSON.stringify(l));

let KEY = null, tiles = [], sel = 0, audio = 0, big = 0, hideT = null, qualOpen = false;
let solo = -1;   // the game shown full screen, or -1 for the grid
function qualLabel(q) {
  if (q.cur === 'auto') return 'Auto' + (q.now ? ` (${q.now})` : '');
  const it = q.list.find(x => x.id === q.cur);
  return it ? it.label : q.now || 'Auto';
}
let layout = STV.store.get('stv.mvLayout', 'grid');
let clean = STV.store.get('stv.mvClean', true);

/* ---------- building the grid ---------- */
function frameFor(t) {
  const s = t.srcs[t.si];
  if (!s) return `<div class="empty">No stream source for ${esc(SPORT_NAME[t.v.sport] || t.v.sport)}. Add one in Settings.</div>`;
  const url = STV.fill(s.url, t.v, s.codes);
  if (s.type === 'video') return `<iframe data-video="1" srcdoc="${esc(videoDoc(url))}" allow="autoplay; fullscreen"></iframe>`;
  const sb = s.sandbox !== false ? ' sandbox="allow-scripts allow-same-origin allow-forms allow-presentation allow-pointer-lock"' : '';
  return `<iframe src="${esc(url)}"${sb} allow="autoplay; fullscreen; encrypted-media; picture-in-picture"></iframe>`;
}
// a direct stream plays in a small page of its own, so every tile takes the same commands
function videoDoc(url) {
  return `<!doctype html><body style="margin:0;background:#000"><video src="${esc(url)}" autoplay muted playsinline style="width:100%;height:100vh;object-fit:contain"></video>` +
    (/\.m3u8/i.test(url) ? `<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"><\/script><script>var v=document.querySelector('video');` +
      `if(!v.canPlayType('application/vnd.apple.mpegurl')&&window.Hls&&Hls.isSupported()){var h=new Hls();h.loadSource(${JSON.stringify(url)});h.attachMedia(v);}<\/script>` : '') +
    `</body>`;
}
const behind = s => { s = Math.round(s); const m = Math.floor(s / 60); return m ? `${m}:${String(s % 60).padStart(2, '0')}` : `${s}s`; };
// phones: tapping a game's label selects it and moves the sound there
$('grid').addEventListener('click', e => {
  const cap = e.target.closest('.cap'); if (!cap) return;
  const i = [...$('grid').children].indexOf(cap.closest('.tile'));
  if (i >= 0) { if (solo >= 0) return; if (sel === i && audio === i && e.detail >= 2) { enterSolo(i); return; } sel = i; setAudio(i); }
});
function tileEl(i) { return $('grid').children[i]; }
const tileInner = t => `${frameFor(t)}<div class="cap"><span class="sp">🔊</span><b>${esc(t.v.title)}</b><span class="st"></span></div>`;
function build() {
  $('grid').innerHTML = tiles.map((t, i) => `<div class="tile" data-i="${i}">${tileInner(t)}</div>`).join('');
  tiles.forEach((t, i) => hookFrame(i));
  paint();
}
function hookFrame(i) {
  const f = tileEl(i).querySelector('iframe');
  const t = tiles[i];
  t.st = null; t.tapped = false; t.qWant = null;   // a new player starts on its own quality
  if (f) f.addEventListener('load', () => { setTimeout(() => send(tiles.indexOf(t), 'status'), 600); setTimeout(() => send(tiles.indexOf(t), 'status'), 1500); });
  // a player that shows no video after a few seconds probably wants its play button clicked
  clearTimeout(t.tapT);
  t.tapT = setTimeout(() => { const j = tiles.indexOf(t); if (j >= 0 && !(t.st && t.st.has)) tapTile(j); }, 6000);
}
function tapTile(i) {
  const t = tiles[i];
  if (!t || t.tapped || !bridge) return;
  t.tapped = true;
  if (barOpen()) hideBar();
  const r = tileEl(i).getBoundingClientRect();
  bridge.call('tap', (r.left + r.width / 2) / innerWidth, (r.top + r.height * 0.55) / innerHeight);
  setTimeout(() => send(i, 'status'), 1200);
}
function paint() {
  const n = tiles.length;
  const cls = `n${n} ${n > 1 ? layout : 'grid'}${solo >= 0 ? ' solo' : ''}`;
  if ($('grid').className !== cls) $('grid').className = cls;
  tiles.forEach((t, i) => {
    const el = tileEl(i);
    el.classList.toggle('sel', i === sel && n > 1);
    el.classList.toggle('aud', i === audio);
    el.classList.toggle('big', i === big);
    el.classList.toggle('solo', i === solo);
    const st = el.querySelector('.st');
    // whole seconds would change every check; show the time behind to the nearest 10 seconds
    const txt = !KEY ? '' : !t.st ? 'connecting…' : !t.st.has ? 'tap video' : t.st.paused ? 'paused'
      : t.st.live && t.st.behind > 15 ? `${behind(Math.round(t.st.behind / 10) * 10)} behind` : '';
    if (st.textContent !== txt) st.textContent = txt;
  });
  autoQuality();
}

/* ---------- lighter streams for the muted games ----------
   A Fire TV Stick decodes about two HD streams at once. With 3 or more games, the games without the
   sound drop to about 480p and the game with the sound stays on Auto; the quality follows the sound.
   A quality you pick yourself for a game is kept. */
function lightId(q) {
  const opts = q.list.map(x => ({ id: x.id, h: parseInt(x.label, 10) || 0 })).filter(x => x.h);
  if (!opts.length) return null;
  const under = opts.filter(x => x.h <= 540).sort((a, b) => b.h - a.h);
  return (under[0] || opts.sort((a, b) => a.h - b.h)[0]).id;
}
// the best quality up to 1080p, for the game with the sound (players don't always climb back on Auto)
function bestId(q) {
  const opts = q.list.map(x => ({ id: x.id, h: parseInt(x.label, 10) || 0 })).filter(x => x.h && x.h <= 1080).sort((a, b) => b.h - a.h);
  return opts.length ? opts[0].id : 'auto';
}
function autoQuality() {
  const busy = tiles.length >= 3;
  tiles.forEach((t, i) => {
    const q = t.st && t.st.has && t.st.q;
    if (!q || !q.list || !q.list.length || t.qManual) return;
    // fewer than 3 games: leave untouched players on their own Auto; ones we lowered go back up
    if (!busy && !t.qWant && solo < 0) return;
    const want = solo >= 0 ? (i === solo ? bestId(q) : lightId(q)) : (busy && i !== audio ? lightId(q) : bestId(q));
    if (!want || t.qWant === want) return;
    t.qWant = want;
    send(i, 'quality', want);
  });
}

/* ---------- commands to each game's player ---------- */
function send(i, a, v) {
  const el = tileEl(i), f = el && el.querySelector('iframe');
  if (!f || !f.contentWindow || !KEY) return;
  try { f.contentWindow.postMessage({ stv: 'cmd', key: KEY, a, v }, '*'); } catch (e) {}
}
/* ---------- one game full screen, without leaving multiview ----------
   It gets the sound and its best quality; the others pause so only one stream is decoded. Left and right
   switch which game fills the screen; Back returns to the grid, where paused live games jump to live. */
function enterSolo(i) {
  if (!tiles[i]) return;
  solo = i; sel = i;
  tiles.forEach((t, j) => { if (j !== i) send(j, 'pause'); else send(j, 'play'); });
  hideBar();
  setAudio(i);
  nav() && nav().toast(tiles.length > 1 ? `${tiles[i].v.title} · Left/Right: other games · Back: all games` : tiles[i].v.title, 2600);
}
function exitSolo() {
  if (solo < 0) return;
  const was = solo;
  solo = -1;
  tiles.forEach((t, j) => { if (j !== was) send(j, t.st && t.st.live ? 'live' : 'play'); });
  paint();
}
function setAudio(i) {
  audio = i;
  tiles.forEach((t, j) => send(j, 'mute', j !== i));
  send(i, 'play');
  paint();
}
window.addEventListener('message', e => {
  const d = e.data;
  if (!d || d.stv !== 'status' || !KEY || d.key !== KEY) return;
  const i = tiles.findIndex((t, j) => { const f = tileEl(j) && tileEl(j).querySelector('iframe'); return f && f.contentWindow === e.source; });
  if (i < 0) return;
  const first = !(tiles[i].st && tiles[i].st.has) && d.s && d.s.has;
  tiles[i].st = d.s;
  if (first) {
    // a player just answered: sound only on the chosen game, fill its tile, start it
    send(i, 'mute', i !== audio);
    if (clean) send(i, 'fill', true);
    send(i, 'play');
    const t = tiles[i];
    setTimeout(() => { const j = tiles.indexOf(t); if (j >= 0 && t.st && t.st.has && t.st.paused) { send(j, 'play'); setTimeout(() => { if (t.st && t.st.paused) tapTile(tiles.indexOf(t)); }, 1500); } }, 1500);
  }
  paint();
  // the LIVE button's dot turns red or gray as the selected game reaches or falls behind live
  if (i === sel && barOpen() && !qualOpen) {
    const at = !!(d.s && d.s.live && !(d.s.behind > 15)) + ':' + !!(d.s && d.s.live);
    if (at !== tiles[i].liveSig) {
      tiles[i].liveSig = at;
      const f = nav() && nav().focused();
      redrawKeep(f && f.dataset ? f.dataset.a : 'live');
    }
  }
});
// check each game every 1.5 seconds until its video is found, then every 4.5 seconds,
// staggered so the games aren't all asked at once
let tick = 0;
setInterval(() => {
  if (document.hidden) return;
  tick++;
  tiles.forEach((t, i) => { if (!(t.st && t.st.has) || (tick + i) % 3 === 0) send(i, 'status'); });
}, 1500);

/* ---------- options bar ---------- */
const barOpen = () => !$('bar').classList.contains('off');
function showBar(ms) {
  drawBar();
  $('bar').classList.remove('off');
  clearTimeout(hideT);
  if (ms !== 0) hideT = setTimeout(hideBar, ms || 8000);
  setTimeout(() => {
    const f = nav() && nav().focused();
    if (!f || !$('bar').contains(f)) { const b = $('chips').querySelector('button'); if (b && nav()) nav().focus(b, { noScroll: true }); }
  }, 30);
}
function hideBar() { $('bar').classList.add('off'); clearTimeout(hideT); qualOpen = false; }
function drawBar() {
  const t = tiles[sel];
  $('sub').textContent = t ? `Selected: ${t.v.title}${sel === audio ? ' · has the sound' : ''}` : '';
  if (!t) {
    $('chips').innerHTML = `<button class="chip" type="button" data-a="add">＋ Add a game</button><button class="chip" type="button" data-a="back">Back to games</button>`;
    return;
  }
  const n = tiles.length, srcs = t.srcs, q = t.st && t.st.q;
  if (qualOpen && q && q.list.length) {
    $('chips').innerHTML = [['auto', 'Auto'], ...q.list.map(x => [x.id, x.label])]
      .map(([id, label]) => `<button class="chip${q.cur === id ? ' on' : ''}" type="button" data-q="${esc(id)}">${esc(label)}</button>`).join('')
      + `<button class="chip" type="button" data-a="qdone">Done</button>`;
    $('hint').textContent = `Quality for ${t.v.title} · Auto lets the player choose`;
    return;
  }
  const ic = (a, name, label, cls) => `<button class="ic${cls ? ' ' + cls : ''}" type="button" data-a="${a}" aria-label="${esc(label)}">${STV.icon(name)}</button>`;
  let h = '';
  if (n < 4) h += ic('add', 'add', 'Add a game');
  h += ic('swap', 'swap', `Switch ${t.v.title} for another game`);
  if (n > 1 && sel !== audio) h += ic('audio', 'sound', `Sound to ${t.v.title}`);
  if (n > 1) h += ic('layout', layout === 'grid' ? 'grid' : 'focus', layout === 'grid' ? 'Layout: even grid (switch to big + small)' : 'Layout: big + small (switch to even grid)');
  if (n > 1 && layout === 'focus' && sel !== big) h += ic('big', 'big', 'Make this game big');
  const st = t.st || {};
  if (st.has) h += ic('back60', 'back60', `${t.v.title}: back 1 minute`) + ic('fwd60', 'fwd60', `${t.v.title}: forward 1 minute`);
  if (st.has && st.live) { const at = !(st.behind > 15); h += `<button class="chip" type="button" data-a="live" aria-label="${at ? `${esc(t.v.title)} is at live` : `Jump ${esc(t.v.title)} to live`}"><i class="livedot${at ? ' on' : ''}"></i>LIVE${at ? '' : ` <span style="opacity:.7;font-weight:500">−${behind(st.behind)}</span>`}</button>`; }
  if (n > 1 && tiles.some(x => x.st && x.st.has && x.st.live)) h += `<button class="chip" type="button" data-a="liveall" aria-label="Jump every game to live">All live</button>`;
  h += ic('clean', 'fill', 'Fill tiles', clean ? 'on' : '');
  if (q && q.list.length) h += `<button class="chip" type="button" data-a="qual" aria-label="Quality for ${esc(t.v.title)}">${esc(qualLabel(q))}</button>`;
  if (srcs.length > 1) h += `<button class="chip" type="button" data-a="src" aria-label="Switch source">${esc(srcs[t.si].name)}</button>`;
  if (!t.v.channel && /^(nba|nfl|cfb|mlb)$/.test(t.v.sport)) h += ic('box', 'stats', t.v.gameId === 'redzone' ? 'Scores around the NFL' : `Box score for ${t.v.title}`);
  h += '<span class="sep"></span>';
  h += ic('tap', 'tap', 'Tap the video (for players that need a click to start)');
  h += ic('full', solo >= 0 ? 'grid' : 'fill', solo >= 0 ? 'Back to all games' : `Full screen: ${t.v.title}`, solo >= 0 ? 'on' : '');
  h += ic('remove', 'remove', 'Remove this game');
  h += ic('back', 'back', 'Back to games');
  $('chips').innerHTML = h;
  setHint();
}
function setHint() {
  const f = nav() && nav().focused();
  const label = f && $('chips').contains(f) ? f.getAttribute('aria-label') || f.textContent.trim() : '';
  const tip = KEY ? 'Bar closed: arrows move to a game and its sound · Menu (☰) opens this bar' : 'Sound switching works in the Fire TV app';
  $('hint').innerHTML = label ? `<b>${esc(label)}</b>` : esc(tip);
}
$('chips').addEventListener('focusin', () => setTimeout(setHint, 0));
function redrawKeep(a) {
  drawBar();
  const el = $('chips').querySelector(`[data-a="${a}"]`) || $('chips').querySelector('button');
  if (el && nav()) nav().focus(el, { noScroll: true });
}
$('chips').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const a = b.dataset.a, t = tiles[sel];
  if (b.dataset.q != null) { tiles[sel].qManual = true; tiles[sel].qWant = b.dataset.q; send(sel, 'quality', b.dataset.q); qualOpen = false; setTimeout(() => redrawKeep('qual'), 700); redrawKeep('qual'); return; }
  if (a === 'qual' || a === 'qdone') {
    qualOpen = a === 'qual'; drawBar();
    const el = $('chips').querySelector(qualOpen ? '.chip.on' : '[data-a="qual"]') || $('chips').querySelector('button');
    if (el && nav()) nav().focus(el, { noScroll: true });
    return;
  }
  if (a === 'back') { history.length > 1 ? history.back() : (location.href = 'index.html'); return; }
  if (a === 'add') { openPicker(-1); return; }
  if (!t) return;
  if (a === 'swap') { openPicker(sel); return; }
  if (a === 'box') { hideBar(); BOX.open(t.v); return; }
  if (a === 'back60' || a === 'fwd60') { send(sel, 'seek', a === 'back60' ? -60 : 60); setTimeout(() => redrawKeep(a), 700); return; }
  if (a === 'live') { send(sel, 'live'); setTimeout(() => redrawKeep('live'), 900); nav() && nav().toast(`${t.v.title}: live`, 1500); return; }
  if (a === 'liveall') { tiles.forEach((x, i) => { if (x.st && x.st.live) send(i, 'live'); }); setTimeout(() => redrawKeep('liveall'), 900); nav() && nav().toast('Every game: live', 1500); return; }
  if (a === 'audio') { setAudio(sel); redrawKeep('layout'); }
  else if (a === 'layout') { layout = layout === 'grid' ? 'focus' : 'grid'; STV.store.set('stv.mvLayout', layout); paint(); redrawKeep('layout'); }
  else if (a === 'big') { big = sel; paint(); redrawKeep('layout'); }
  else if (a === 'clean') { clean = !clean; STV.store.set('stv.mvClean', clean); tiles.forEach((x, i) => send(i, 'fill', clean)); redrawKeep('clean'); }
  else if (a === 'src') {
    t.si = (t.si + 1) % t.srcs.length;
    const el = tileEl(sel); el.querySelector('iframe, .empty').outerHTML = frameFor(t);
    hookFrame(sel); paint(); redrawKeep('src');
  }
  else if (a === 'tap') {
    hideBar();
    const r = tileEl(sel).getBoundingClientRect();
    setTimeout(() => { if (bridge) bridge.call('tap', (r.left + r.width / 2) / innerWidth, (r.top + r.height / 2) / innerHeight); }, 300);
  }
  else if (a === 'full') { solo >= 0 ? exitSolo() : enterSolo(sel); }
  else if (a === 'remove') {
    if (solo >= 0) exitSolo();
    const key = t.v.key;
    saveMulti(multi().filter(v => v.key !== key));
    tileEl(sel).remove(); tiles.splice(sel, 1);
    if (!tiles.length) { location.href = 'index.html'; return; }
    if (audio === sel) audio = 0; else if (audio > sel) audio--;
    if (big === sel) big = 0; else if (big > sel) big--;
    sel = Math.min(sel, tiles.length - 1);
    tiles.forEach((x, i) => { tileEl(i).dataset.i = i; });
    setAudio(audio);
    redrawKeep('remove');
  }
});

/* ---------- picking a game with the arrows ---------- */
function moveSel(dir) {
  const r = tileEl(sel).getBoundingClientRect(), cx = (r.left + r.right) / 2, cy = (r.top + r.bottom) / 2;
  let best = -1, bs = Infinity;
  tiles.forEach((t, i) => {
    if (i === sel) return;
    const q = tileEl(i).getBoundingClientRect(), x = (q.left + q.right) / 2, y = (q.top + q.bottom) / 2;
    const dx = x - cx, dy = y - cy;
    const ok = dir === 'right' ? dx > 5 : dir === 'left' ? dx < -5 : dir === 'down' ? dy > 5 : dy < -5;
    if (!ok) return;
    const sc = (dir === 'left' || dir === 'right') ? Math.abs(dx) + Math.abs(dy) * 2 : Math.abs(dy) + Math.abs(dx) * 2;
    if (sc < bs) { bs = sc; best = i; }
  });
  // the sound follows the game you move to
  if (best >= 0) { sel = best; setAudio(sel); return true; }
  return false;
}
const DIRS = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right' };
window.addEventListener('keydown', e => {
  if (BOX.isOpen() || pickerOpen()) return;   // the box score or the game picker has the remote; Back closes it
  if (barOpen()) { clearTimeout(hideT); hideT = setTimeout(hideBar, 8000); return; }
  const k = e.key;
  if (k === 'Backspace' || k === 'Escape') return;
  if (solo >= 0 && (k === 'ArrowLeft' || k === 'ArrowRight')) {
    if (tiles.length > 1) enterSolo((solo + (k === 'ArrowRight' ? 1 : tiles.length - 1)) % tiles.length);
  }
  else if (solo >= 0 && DIRS[k]) showBar();
  else if (DIRS[k]) { if (!tiles.length || (!moveSel(DIRS[k]) && DIRS[k] === 'up')) showBar(); }
  else if (k === 'Enter' || e.keyCode === 23) { if (tiles.length) setAudio(sel); }
  else showBar();
  e.preventDefault(); e.stopImmediatePropagation();
}, true);
window.__tvMenu = () => { barOpen() ? hideBar() : showBar(); return true; };
window.__tvMedia = a => { if (tiles[audio]) send(audio, a === 'ff' ? 'seek' : a === 'rw' ? 'seek' : 'playpause', a === 'ff' ? 10 : a === 'rw' ? -10 : undefined); return true; };
window.__tvBackHook = () => {
  if (pickerOpen()) { closePicker(); return true; }
  if (barOpen() && tiles.length) { hideBar(); return true; }
  if (solo >= 0) { exitSolo(); return true; }
  return false;
};
document.addEventListener('keydown', e => { if (e.key === 'Escape' && barOpen()) hideBar(); });

/* ---------- adding and switching games ---------- */
const PATHS = { nba: 'basketball/nba', nfl: 'football/nfl' };
const SNAME = { nba: 'NBA', nfl: 'NFL' };
let pickFor = -1, pickItems = [];
const pickerOpen = () => !$('pick').hidden;
const pad2 = n => String(n).padStart(2, '0');
function todayKey() { const d = new Date(); return `${d.getFullYear()}${pad2(d.getMonth() + 1)}${pad2(d.getDate())}`; }
// the same game info the home screen hands the player
function varsFor(ev, sport) {
  const c = ev.competitions[0], cs = c.competitors.slice().sort((a, b) => (a.homeAway === 'home') - (b.homeAway === 'home'));
  const [a, h] = cs.map(x => x.team || {}), etd = STV.etDay(new Date(ev.date));
  return { sport, gameId: ev.id, date: etd, yyyymmdd: etd.replace(/-/g, ''),
    away: (a.abbreviation || '').toLowerCase(), home: (h.abbreviation || '').toLowerCase(), AWAY: a.abbreviation, HOME: h.abbreviation,
    awayNick: STV.slug(a.name || a.shortDisplayName), homeNick: STV.slug(h.name || h.shortDisplayName),
    awayName: STV.slug(a.displayName), homeName: STV.slug(h.displayName),
    title: `${a.abbreviation} at ${h.abbreviation}`, key: `${sport}:${ev.id}` };
}
async function loadPickItems() {
  const day = todayKey(), items = [];
  const boards = await Promise.all(Object.keys(PATHS).map(s =>
    fetch(`https://site.api.espn.com/apis/site/v2/sports/${PATHS[s]}/scoreboard?dates=${day}`, { cache: 'no-store' })
      .then(r => r.json()).then(j => [s, j.events || []]).catch(() => [s, []])));
  const chans = await STV.channels();
  for (const [s, evs] of boards) {
    for (const ch of chans.filter(c => c.sport === s))
      items.push({ v: { sport: s, gameId: ch.id, channel: ch.id, title: ch.name, key: `${s}:${ch.id}` }, label: ch.name, sub: '24/7 channel', live: true });
    if (s === 'nfl' && evs.length) {
      const etd = STV.etDay(new Date());
      items.push({ v: { sport: 'nfl', gameId: 'redzone', date: etd, yyyymmdd: etd.replace(/-/g, ''), away: 'redzone', home: 'redzone', AWAY: 'REDZONE', HOME: 'REDZONE',
        awayNick: 'redzone', homeNick: 'redzone', awayName: 'redzone', homeName: 'redzone', title: 'NFL RedZone', key: 'nfl:redzone' },
        label: 'NFL RedZone', sub: evs.some(e => e.status.type.state === 'in') ? 'Live' : 'Sunday', live: evs.some(e => e.status.type.state === 'in') });
    }
    const rank = { in: 0, pre: 1, post: 2 };
    evs.slice().sort((a, b) => (rank[a.status.type.state] - rank[b.status.type.state]) || (new Date(a.date) - new Date(b.date))).forEach(ev => {
      const st = ev.status.type, v = varsFor(ev, s);
      // no scores here: live, start time, or final
      const sub = st.state === 'in' ? 'Live' : st.state === 'pre' ? new Date(ev.date).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : 'Final';
      items.push({ v, label: v.title, sub: `${SNAME[s]} · ${sub}`, live: st.state === 'in', sport: s, rank: rank[st.state], at: new Date(ev.date) });
    });
  }
  // live first (games, RedZone, channels), then upcoming by start time, then finished
  const r = x => x.live ? (x.v.channel ? 1 : 0) : (x.rank != null ? x.rank + 1 : 2);
  return items.map((x, i) => [x, i]).sort((a, b) => (r(a[0]) - r(b[0])) || ((a[0].at || 0) - (b[0].at || 0)) || (a[1] - b[1])).map(x => x[0]);
}
async function openPicker(i) {
  pickFor = i;
  hideBar();
  $('pkt').textContent = i >= 0 ? `Switch ${tiles[i].v.title} for…` : 'Add a game';
  $('pks').textContent = 'Today’s games, live first';
  $('pkl').innerHTML = '<p class="note" style="grid-column:1/-1;color:var(--ink2)">Loading games…</p>';
  $('pick').hidden = false;
  pickItems = await loadPickItems();
  if (!pickerOpen()) return;
  const inView = new Set(tiles.map(t => t.v.key));
  const list = pickItems.filter(x => !inView.has(x.v.key));
  $('pkl').innerHTML = list.length
    ? list.map((x, j) => `<button class="pg" type="button" data-pk="${pickItems.indexOf(x)}"><b>${esc(x.label)}</b><span class="${x.live ? 'live' : ''}">${esc(x.sub)}</span></button>`).join('')
    : '<p style="grid-column:1/-1;color:var(--ink2)">No other games today.</p>';
  const first = $('pkl').querySelector('button') || $('pkx');
  if (first && nav()) nav().focus(first, { noScroll: true });
}
function closePicker() {
  $('pick').hidden = true;
  const el = tileEl(sel);
  if (el && nav()) nav().focus($('chips').querySelector('button') || el, { noScroll: true });
}
$('pkx').onclick = closePicker;
$('pick').addEventListener('keydown', e => { if (e.key === 'Escape') { e.preventDefault(); closePicker(); } });
$('pkl').addEventListener('click', async e => {
  const b = e.target.closest('[data-pk]'); if (!b) return;
  const it = pickItems[+b.dataset.pk];
  const t = { v: it.v, si: 0, st: null, srcs: await STV.streamsFor(it.v), qManual: false, qWant: null };
  if (pickFor >= 0 && tiles[pickFor]) {
    // switch: the tile keeps its spot, its sound and its size
    const i = pickFor;
    tiles[i] = t;
    tileEl(i).innerHTML = tileInner(t);
    hookFrame(i);
  } else {
    if (tiles.length >= 4) return;
    tiles.push(t);
    const el = document.createElement('div'); el.className = 'tile'; el.dataset.i = tiles.length - 1; el.innerHTML = tileInner(t);
    $('grid').appendChild(el);
    hookFrame(tiles.length - 1);
    sel = tiles.length - 1;
    $('msg').hidden = true;
  }
  saveMulti(tiles.map(x => x.v));
  $('pick').hidden = true;
  paint();
  setAudio(sel);
  nav() && nav().toast(pickFor >= 0 ? `Switched to ${it.label}` : `Added ${it.label}`, 2200);
});

/* ---------- start ---------- */
(async function () {
  if (bridge) { bridge.call('keepAwake', true); KEY = await bridge.call('frameKey'); }
  const list = multi().slice(0, 4);
  if (!list.length) {
    $('msg').innerHTML = 'No games in multiview yet.<br>Choose “Add a game” above.';
    $('msg').hidden = false; showBar(0); return;
  }
  tiles = await Promise.all(list.map(async v => ({ v, si: 0, st: null, srcs: await STV.streamsFor(v) })));
  build();
  showBar(6000);
  nav() && nav().toast('Arrows move to a game and its sound · Menu for options', 4000);
})();
addEventListener('pagehide', () => { if (bridge) bridge.call('keepAwake', false); });

/* phones: the controls button, and turning the phone sideways while watching */
$('fab').onclick = () => { barOpen() ? hideBar() : showBar(); };
if (STV.phone && STV.bridge) {
  STV.bridge.call('orientation', 'landscape');
  addEventListener('pagehide', () => STV.bridge.call('orientation', 'auto'));
}
</script>
